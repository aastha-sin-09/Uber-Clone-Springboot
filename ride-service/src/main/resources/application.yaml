server:
  port: 8083

spring:
  application:
    name: ride-service

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  config:
    import: optional:configserver:http://localhost:8888

  data:
    mongodb:
      uri: mongodb+srv://uberclone:uberclone123@uber-clone.io20sgt.mongodb.net/uber_rides?retryWrites=true&w=majority&appName=uber-clone
      database: uber_rides

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: uberclone-super-secret-key-for-jwt-signing-2024
  expiration: 86400000

resilience4j:
  circuitbreaker:
    instances:
      driverService:                    # name we'll use in annotation
        sliding-window-size: 5          # track last 5 calls
        failure-rate-threshold: 50      # open circuit if 50% fail
        wait-duration-in-open-state: 10s # wait 10s before trying again
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true

  retry:
    instances:
      driverService:
        max-attempts: 3                 # retry 3 times before giving up
        wait-duration: 2s              # wait 2s between retries