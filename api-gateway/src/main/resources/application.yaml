spring:
  application:
    name: api-gateway          # Must match the filename in config-server/configs/

  config:
    import: optional:configserver:http://localhost:8888   # Fetch config from Config Server

  cloud:
    gateway:
      routes:

        - id: user-service
          uri: lb://user-service          # lb = load balanced via Eureka
          predicates:
            - Path=/api/users/**          # Any request to /api/users/ goes to user-service

        - id: driver-service
          uri: lb://driver-service
          predicates:
            - Path=/api/drivers/**

        - id: ride-service
          uri: lb://ride-service
          predicates:
            - Path=/api/rides/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG   # See routing decisions in logs